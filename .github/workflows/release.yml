# Builds the Windows installer, with mpv bundled, and attaches it to the GitHub
# Release when you push a v* tag:
#
#   Windows → TinyPlay-Setup-x64.exe      (install / upgrade in place)
#
# Windows artifacts are UNSIGNED for now (no Windows code-signing certificate);
# users may still see a SmartScreen "unknown publisher" prompt.
#
# The macOS DMGs (TinyPlay-macos-arm64.dmg, TinyPlay-macos-intel.dmg) are not
# built here. Since 1.0.9 they are built, Developer ID signed, notarized and
# uploaded to the same release from the maintainer's Mac, which keeps the
# signing certificate off CI and the bundled mpv pinned to builds that run on
# macOS 14. See macos/README.md for building the app yourself.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download & bundle mpv
        shell: bash
        # Also stages vulkan-1.dll (mpv imports it and Windows does not ship it)
        # and fails the job if any bundled binary still has an unmet dependency.
        run: bash ./windows/bundle-mpv.sh dist/mpv

      - name: Embed exe icon
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico assets/icon.ico -manifest cmd/tvremote/app.manifest -o cmd/tvremote/rsrc_windows.syso

      - name: Build exe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          go build -ldflags "-H windowsgui -X main.version=$VER" -o dist/TinyPlay.exe ./cmd/tvremote

      - name: Bundle third-party notices
        shell: bash
        run: cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not installed"
          }
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "0.0.0-dev"
          }
          & $compiler "/DMyAppVersion=$version" "windows\TinyPlay.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TinyPlay-windows-setup
          path: dist/TinyPlay-Setup-x64.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TinyPlay-Setup-x64.exe
